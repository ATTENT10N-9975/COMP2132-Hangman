<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman | COMP 2132 Final Project</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/game.js" defer></script>
</head>
<body>
    <main class="shell">
        <header class="hero">
            <p class="eyebrow">COMP 2132 / FINAL PROJECT</p>
            <h1>Hangman<span>.</span></h1>
            <p>Decode the hidden word before your six chances run out.</p>
        </header>
        <section class="game" aria-label="Hangman game">
            <aside class="visual">
                <div class="visual-top"><span>THE CHALLENGE</span><span id="counter">0 / 6 mistakes</span></div>
                <img id="hangman" src="images/hangman-0.svg" alt="Hangman with zero mistakes" width="320" height="280">
                <div id="chances" class="chances" aria-hidden="true"></div>
                <p id="remaining">6 chances remaining</p>
            </aside>
            <div class="play">
                <p class="eyebrow">YOUR WORD</p>
                <p id="hint" class="hint">Loading word list…</p>
                <div id="word" class="word" aria-label="Hidden word"></div>
                <form id="guess-form" class="guess-form">
                    <label for="letter">Enter a letter</label>
                    <div class="input-row">
                        <input id="letter" type="text" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="A–Z" disabled>
                        <button id="guess-button" class="primary" type="submit" disabled>Guess</button>
                    </div>
                </form>
                <div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div>
                <p id="feedback" class="feedback" role="status" aria-live="polite">Loading…</p>
                <button id="restart" class="secondary" type="button" hidden>Retry</button>
            </div>
        </section>
        <footer>COMP 2132 · JavaScript Project <span>Guess smart. Have fun.</span></footer>
    </main>
    <dialog id="result" class="result" aria-labelledby="result-title" aria-describedby="result-message">
        <svg class="result-face" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="48" />
            <path d="M42 47 L42 49 M78 47 L78 49" />
            <path class="face-smile" d="M36 70 Q60 94 84 70" />
            <path class="face-frown" d="M38 85 Q60 62 82 85 M87 56 Q94 65 87 69 Q80 65 87 56" />
        </svg>
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <button id="play-again" class="secondary" type="button">Try Again</button>
    </dialog>
</body>
</html>
